<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SolarSystem project</title>

  <!-- Import maps -->
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>

<body style="margin:0; overflow:hidden;">
  <script type="module">

    import * as THREE from 'three';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Make a scene to put all the space stuff
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1, // can see this close
      500  // but not that far
    );
    camera.position.set(0, 0, 15); // keeping camera away from the sun


    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight, false); // fill the window 
    document.body.appendChild(renderer.domElement);

    // Lights
    const pointlight = new THREE.PointLight(0xffffff, 2);
    pointlight.position.set(3, 2, 5); // put the light somewhere nice
    scene.add(pointlight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4)); // gentle room light 

    // The big sun in the middle
    const Sun = new THREE.Mesh(
      new THREE.SphereGeometry(1),
      new THREE.MeshStandardMaterial({
        color: 0xffcc00,          // so sunny
        emissive: 0xffaa00,       // pretend it actually glows
        emissiveIntensity: 1.5
      })
    );
    scene.add(Sun);

    // Tiny planets that run laps around the Sun
    const planet1 = new THREE.Mesh(
      new THREE.SphereGeometry(0.2), // smol
      new THREE.MeshStandardMaterial({ color: 0xff3300 }) // red
    );
    const planet2 = new THREE.Mesh(
      new THREE.SphereGeometry(0.3), // medium smol
      new THREE.MeshStandardMaterial({ color: 0x4e9fe5 }) //  blue
    );
    const planet3 = new THREE.Mesh(
      new THREE.SphereGeometry(0.4), // extremely smol
      new THREE.MeshStandardMaterial({ color: 0xEE82EE }) // space gray
    );

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.08), // small moon
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
    );
    scene.add(planet1, planet2, planet3, moon);


    const moonPivot = new THREE.Group();
    planet2.add(moonPivot); // moonPivot now follows planet2 everywhere

    const moonRadius = 0.7;
    moon.position.set(moonRadius, 0, 0);
    moonPivot.add(moon);

    moonPivot.rotation.z += 0.8 * 0.01; // speed of moon


    // Start them somewhere so they don’t all spawn inside the Sun 
    planet1.position.set(0, 2, 0);
    planet2.position.set(2, -3, 0);
    planet3.position.set(7, 0, 0);

    function makeOrbit(radius, color = 0x666666, segments = 128) {
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const t = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(t) * radius, Math.sin(t) * radius, 0));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 });
      const loop = new THREE.LineLoop(geo, mat);
      scene.add(loop);
      return loop;
    }

    const orbit1 = makeOrbit(2, 0x888888); // planet1 radius
    const orbit2 = makeOrbit(4, 0x888888); // planet2 radius
    const orbit3 = makeOrbit(6, 0x888888); // planet3 radius

    // Let the user spin the camera
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 50;

    // Make it not explode when the window changes size
    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height, false);
    }
    window.addEventListener('resize', onResize);

    //  run in circles forever
    function animate() {
      requestAnimationFrame(animate);

      Sun.rotation.y += 0.01; // slow sun spin so it looks alive

      const time = performance.now() * 0.001; // seconds

      // Extremely scientific orbital mechanics sin and cos
      planet1.position.set(Math.sin(time * 0.8) * 2, Math.cos(time * 0.8) * 2, 0);
      planet2.position.set(Math.sin(time * 0.4) * 4, Math.cos(time * 0.4) * 4, 0);
      planet3.position.set(Math.sin(time * 0.2) * 6, Math.cos(time * 0.2) * 6, 0);

      controls.update(); // apply the buttery smoothness
      renderer.render(scene, camera); // draw the space stuff
    }


    animate();
  </script>
</body>

</html>
