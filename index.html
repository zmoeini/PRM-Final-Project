<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System 3JS</title>
</head>
<style>
    body{
        margin:0;
        height:100%;
        background: black;
        overflow: hidden;
        font:14px system-ui;
    }
     #info {
        position: absolute; 
        top: 100px;
        left: 800px;
        color: white;
        font-size: 50px;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

</style>
//BRING IN 3JS
<script type="importmap">
    {
        "imports":
            {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
    }
</script>
<body>
     <div id="info">Click a celestial body to learn more!</div>

     <script type="module">
        //bring in 3js
        import * as THREE from 'three';
        //mouse actions import
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/controls/OrbitControls.js';

        //adding textures to planet
        const loader = new THREE.TextureLoader();


        //SETUP 3JS SCENE
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0d12);

        //SETUP CAMERA
        const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
        camera.position.set(0,6,8);
        camera.lookAt(0,0,0);

        //SETUP RENDERER
        const renderer = new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(innerWidth, innerHeight);

        // RENDER THE HTML IN BODY
        document.body.appendChild(renderer.domElement);

        // RESIVE WINDOW EVENT
        addEventListener('resize',() =>
            {
                camera.aspect= innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            }
        );

        //SET UP GLOBAL LIGHT
        const light = new THREE.HemisphereLight(0x9ecfff,0x0b0d12,0.9);
        scene.add(light);
        const dl = new THREE.DirectionalLight(0xffffff,0.7);
        dl.position.set(3,6,4);
        scene.add(dl);

        //CONTROLS VAR
        const controls = new OrbitControls(camera, renderer.domElement);

        //RAYCAST + POINTER VAR
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2(); //mouse pos

        //SUN
        const sun = new THREE.Mesh (
        new THREE.SphereGeometry(0.8), new THREE.MeshBasicMaterial({ map: loader.load("/textures/suntexture.jpg") })); //i brought in textures!
        scene.add(sun); 

        //add some vfx to our sun with a glow
        const sunGlow = new THREE.PointLight(0xFFDA21, 30, 200);
        sunGlow.position.set(0,0,0);
        scene.add(sunGlow);
    
        //make the rest of the planets
        const mercury = makePlanet("mercury", 0.2, "textures/mercurytexture.jpg", 2);
        makeRing(1.5); //this is how tight it orbits around the sun

        const venus = makePlanet("venus", 0.3, "textures/venustexture.jpg", 3);
        makeRing(2.5);

        const earth = makePlanet("earth", 0.3, "textures/earthtexture.jpg", 5);
        makeRing(4);

        const moon = makePlanet("moon", 0.1, "textures/mercurytexture.jpg", 5.4);
        //no make ring bc i manually make it spin around the earth without a white circle

        const mars = makePlanet("mars", 0.2, "textures/marstexture.jpg", 6);
        makeRing(6);
      
    
        //click on celestial object event
        addEventListener('pointerdown', (event)=>
    {
         pointer.x = (event.clientX / innerWidth)*2 -1;
         pointer.y = -(event.clientY / innerHeight)*2 + 1;
         raycaster.setFromCamera(pointer, camera);

         const hit = raycaster.intersectObjects([sun, mercury, venus, earth, mars, moon])[0];

            if (hit) document.getElementById('info').innerText = "You viewed: " + 
                (hit.object === sun ? "the Sun, around which we orbit" :
                hit.object === mercury ? "Mercury, the Swift Planet" :
                hit.object === venus ? "Venus, the Evening Star" :
                hit.object === earth ? "Earth, the Blue Planet" :
                hit.object === mars ? "Mars, the Red Planet" :
                "the Moon, our loyal friend");
            //hardcoded it to have different nice descriptions
        }
    );

        //Anims
        function loop(){
            requestAnimationFrame(loop);

            mercury.position.x= 1.5 * Math.cos(Date.now()*0.001); //circular equation
            mercury.position.z = 1.5 * Math.sin(Date.now() * 0.001);

            venus.position.x= 2.5 * Math.cos(Date.now()*0.001);
            venus.position.z = 2.5 * Math.sin(Date.now() * 0.001);

            earth.position.x= 4 * Math.cos(Date.now()*0.001);
            earth.position.z = 4 * Math.sin(Date.now() * 0.001);
            moon.position.x = earth.position.x + 0.4 * Math.cos (Date.now() * 0.005);
            moon.position.z = earth.position.z + 0.4 * Math.sin (Date.now() * 0.005);

            mars.position.x= 6 * Math.cos(Date.now()*0.001);
            mars.position.z = 6 * Math.sin(Date.now() * 0.001);

            //update the controls
            controls.update();
            //render view
            renderer.render(scene, camera);
        }

        loop(); //call funct

function makePlanet(name, size, texture, distance){
        const object = new THREE.Mesh (
        new THREE.SphereGeometry(size), new THREE.MeshStandardMaterial( { map: loader.load(texture) } )); //standard so interacts with light
        object.position.x = distance;
        //distance from the sun /\
        scene.add(object);
        object.name = name;
        return object;
}

function makeRing(distance) { //distance from the sun
  
    var orbitPoints = []; //connect dots to make ring, stored here

    for (var i = 0; i < 60; i++) { //our circle will have 60 pts (denotes how smooth it is)
        var angle = (i / 60) * Math.PI * 2; //divvy up our circle in 60 pts
        orbitPoints.push(new THREE.Vector3(Math.cos(angle) * distance, 0, Math.sin(angle) * distance));
    }

    var ringGeo= new THREE.BufferGeometry(); //container for shapes ie points and lines
    ringGeo.setFromPoints(orbitPoints); //make shape out of our pts
    var ringMat = new THREE.LineBasicMaterial({color: 0xffffff }); //orbit ring is white
    var orbitRing = new THREE.LineLoop(ringGeo, ringMat); //combine color and geo for ring

    scene.add(orbitRing);
    return orbitRing;
}

        
        </script>
</body>
</html>
