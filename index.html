<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Setup</title>
  <script type="importmap">
    {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<style>
  body {
    margin: 0;
  }
</style>

<body>


<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// All the constant to avoid using magic numbers
const BASE_SPEED_MULTIPLIER = 30;
const MIN_ORBIT_DISTANCE = 20;
const DELTA_ORBIT_DISTANCE = 15;
const DISK_FLATNESS = 20;
const G = 1;
const SUN_MASS = 1000;
const SUN_SIZE = 8;

// Grid that is renderedunder the sun
const GRID_SIZE = 200;
const GRID_DIVISIONS = 20;
const GRID_AXES_COLOR = 0xff00ff;
const GRID_LINES_COLOR = 0xffff00;
const GRID_OPACITY = 0.2;

// Camera settings
const CONTROL_MIN_DISTANCE = 50;
const CONTROL_MAX_DISTANCE = 500;
const CONTROL_DAMPING_FACTOR = 0.05;
const CAMERA_DEFAULT_X = 0;
const CAMERA_DEFAULT_Y = 50;
const CAMERA_DEFAULT_Z = 100;
const CAMERA_FOV = 60;
const MAX_RENDER_DISTANCE = 1000;
const MIN_RENDER_DISTANCE = 0.1;

// Plannet settings
const PLANET_MASS = 3;
const PLANET_SIZE = 2;
const PLANET_RED_MIN        = 0.50;
const PLANET_RED_MAX        = 0.80;
const PLANET_GREEN_MIN      = 0.30;
const PLANET_GREEN_MAX      = 1.00;
const PLANET_BLUE_MIN       = 0.20;
const PLANET_BLUE_MAX       = 1.00;
const PLANETS_NUM = 7;

// 3d sphere render settings
const SPHERE_GEOMETRY_QUALITY = 32;

// Lights in the scene
const SUN_LIGHT_INTENSITY = 3000;
const SUN_LIGHT_DISTANCE = 0; // infinite
const SUN_EMISSIVE_INTENSITY = 10;
const SUN_COLOR = 0xffff00;
const SUN_EMISSIVE_COLOR = 0xffaa00;
const AMBIENT_LIGHT_COLOR      = 0xffffff;
const AMBIENT_LIGHT_INTENSITY  = 0.06;

// Simulation settings
const FRAME_TIME_CAP = 0.25;
const MIN_GRAVITY_DISTANCE = 1;
const FIXED_TIMESTEP = 0.001;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(CAMERA_FOV, window.innerWidth / window.innerHeight, MIN_RENDER_DISTANCE, MAX_RENDER_DISTANCE);
camera.position.set(CAMERA_DEFAULT_X, CAMERA_DEFAULT_Y, CAMERA_DEFAULT_Z);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () =>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});



class Body {
  constructor(pos, color, initialVelocity, size, mass) {
    this.color = color;
    
    this.velocity = initialVelocity;

    this.size = size;
    this.sphereGeometry = new THREE.SphereGeometry(size, SPHERE_GEOMETRY_QUALITY, SPHERE_GEOMETRY_QUALITY); 
    this.material = new THREE.MeshStandardMaterial({color: color});

    this.mass = mass;

    this.mesh = new THREE.Mesh(this.sphereGeometry, this.material);
    this.mesh.position.copy(pos);
    scene.add(this.mesh);
  }

  getPos() {
    return this.mesh.position;
  }

  addPos(delta) {
    this.mesh.position.add(delta);
  }

}

class Sun extends Body {
  constructor(pos, size, mass) {
    super(pos, SUN_COLOR, new THREE.Vector3(0,0,0), size, mass);
    this.mesh.material = new THREE.MeshStandardMaterial({
      color: SUN_COLOR,
      emissive: SUN_EMISSIVE_COLOR,
      emissiveIntensity: SUN_EMISSIVE_INTENSITY
    });
    const sunLight = new THREE.PointLight(0xffffff, SUN_LIGHT_INTENSITY, SUN_LIGHT_DISTANCE);
    this.mesh.add(sunLight);
  }
}


class Simulation {
    
  constructor(g) {
    this.g = g;
    this.bodies = []
  }

  add(body) {
    this.bodies.push(body);
  }

  // Gravity simulation
  tick(dt) {
    // For every body


    for (let i = 0; i < this.bodies.length; i++) {
        let force = new THREE.Vector3(0, 0, 0);
        let currentBody = this.bodies[i];
        // Calculate a force from every other body pulling current
        for (let j = 0; j < this.bodies.length; j++) {
          // If the pulling planet is the same as this ignore it
          if (i == j) {
              continue;
            }
            // The body that's pulling current
            let pullingBody = this.bodies[j];
            // vector: pulling - current 
            let delta = pullingBody.getPos().clone().sub(currentBody.getPos());
            let distance = delta.length();
            
            // Distance limitation for numerical stability.
            if (distance < MIN_GRAVITY_DISTANCE) {
                continue;
            }
            
            let direction = delta.clone();
            direction.multiplyScalar(1 / distance);
            
            // g*m1*m2/distance^2
            let multiplier = this.g * currentBody.mass * pullingBody.mass / distance / distance; 
            // normalized direction * force given by this pulling body
            force.add(direction.multiplyScalar(multiplier));
        }
        // divide force by mass to find acceleration. This is done to implement the gravity law.
        currentBody.velocity.add(force.multiplyScalar(dt / currentBody.mass));
        currentBody.addPos(currentBody.velocity.clone().multiplyScalar(dt));
    }
  }

}

// Mouse
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = CONTROL_DAMPING_FACTOR;
controls.minDistance = CONTROL_MIN_DISTANCE;
controls.maxDistance = CONTROL_MAX_DISTANCE;

scene.add(new THREE.AmbientLight(AMBIENT_LIGHT_COLOR, AMBIENT_LIGHT_INTENSITY));

// g acceleration
let simulation = new Simulation(G);

// A massive object in the center
let sun = new Sun(new THREE.Vector3(0, 0, 0), SUN_SIZE, SUN_MASS);
simulation.add(sun);

// For clarity of camera position (absence of background doesn't let it be cool)
function addGrid(size, divisions, axesColor, linesColor, opacity) {
    const grid = new THREE.GridHelper(size, divisions, axesColor, linesColor);
    grid.position.y = -sun.size;
    grid.material.transparent = true;
    grid.material.opacity = opacity
    scene.add(grid);
}

addGrid(
    GRID_SIZE,
    GRID_DIVISIONS,
    GRID_AXES_COLOR,
    GRID_LINES_COLOR,
    GRID_OPACITY
);

// Function to generate a random number (from min to max)
function randomRange(min, max) {
    return THREE.MathUtils.lerp(min, max, Math.random());
}

for (let i = 0; i < PLANETS_NUM; i++) {
    
    let distance = MIN_ORBIT_DISTANCE + i * DELTA_ORBIT_DISTANCE;

    // A random point close the the disk
    let position = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) / DISK_FLATNESS, Math.random() - 0.5);
    position.normalize();
    position.multiplyScalar(distance);

    let r = position.clone();
    let axis = new THREE.Vector3(0, 1, 0);
    // Cross product to find a direction perpendicular to both axes (disk rotation and sun direction)
    let direction = new THREE.Vector3().crossVectors(r, axis).normalize();
    let speed = BASE_SPEED_MULTIPLIER / Math.sqrt(distance);
    let velocity = direction.multiplyScalar(speed);
    
    let color = new THREE.Color(
        randomRange(PLANET_RED_MIN,   PLANET_RED_MAX),
        randomRange(PLANET_GREEN_MIN, PLANET_GREEN_MAX),
        randomRange(PLANET_BLUE_MIN,  PLANET_BLUE_MAX)
    );

    // Set the planet to the position on the orbit
    let planet = new Body(position, color, velocity, PLANET_SIZE, PLANET_MASS); // size and mass

    simulation.add(planet);
}

let previousTime = performance.now();
let accumulator = 0;

function loop(currentTime = performance.now()) {
    requestAnimationFrame(loop);
    // time since last frame (in seconds)
    const frameTime = (currentTime - previousTime) / 1000;
    previousTime = currentTime;

    // prevent spiral death on lag/tab minimize
    const maxFrameTime = FRAME_TIME_CAP; // cap
    accumulator += Math.min(frameTime, maxFrameTime);

    // fixed physics steps
    while (accumulator >= FIXED_TIMESTEP) {
        simulation.tick(FIXED_TIMESTEP);
        accumulator -= FIXED_TIMESTEP;
    }

    controls.update();
    renderer.render(scene, camera);
}

// start the loop
loop();

</script>
</body>
</html>
