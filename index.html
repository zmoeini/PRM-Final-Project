<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SOLAR SYSTEM - Emmanuel Leon 2025-11-25</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #f0f7ff 0%, #cce3ff 100%); /*Adding backgroun Emmanuel Leon 2025-11-25*/
        color: #0d0d0d;
        font-family: sans-serif;
      }
      /*Change the attributes of the label Click a planet Emmanuel Leon 2025-11-25*/
      #info {                          
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(28, 94, 59, 0.8);
        padding: 10px 15px;
        border-radius: 10px;
        font-weight: bold;
        color: #b10404;
        box-shadow: 0 0 10px rgba(21, 255, 0, 0.46);
      }
    </style>
 
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.168.0/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="info">Click a planet</div> <!--UI element pointing to the label Click a planet-->

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        

      //Creating the scene 
      const scene = new THREE.Scene();

      //Creating perspective camera
      // FOV = 60 D, Aspect = viewport width/height , near clipping 0.1, far clipping = 100
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 10, 25);
      // We should be settling the camera above the plane and a little bit back to have the whole image of the system

      // Creates the WebGL renderer , antialaias smooths edges 
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      // Set canvas size to browser window size 

      // Fixing the shadows Emmanuel Leon 2025-10-12
      renderer.shadowMap.enabled = true;
      // Enable shadow map rendering without this, no shadows will be drawn Emmanuel Leon 2025-10-12
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      // Choose a soft shadow algorithm for smoother shadows
      document.body.appendChild(renderer.domElement);
      // add the renderer canvas element to the page so you can see the scene

       // Create orbit controls that let you rotate/zoom/pan the camera with the mouse Emmanuel Leon 2025-10-12
      const controls = new OrbitControls(camera, renderer.domElement); 

      // ambient light 
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.18);
      scene.add(ambientLight);

      //  HIGH RES SHADOWS FOR BETTER VISIBILITY
      const sunLight = new THREE.PointLight(0xffffff, 3.5, 300);
     // PointLight simulates the Sun; color white, intensity 3.5, max distance 300 units
      sunLight.castShadow = true; // enable shadows form this light
      sunLight.shadow.mapSize.width = 2048; //Increase shadow map resolution for crisper shadows
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.bias = -0.001;//Small bias to reduce shadow acne (self shadow artifacts)
      //the light still needs to be added to the scene or attached to an object (we attach it to the sun below) Emmanuel Leon 2025-10-12
      // Fixed 1 castshadow and receiveshadow are now working this will simulate shadows in the planets Emmanuel leon 2025-12-12
      

      /* Adding ------------------- SUN -------------------- */
      const sunMaterial = new THREE.MeshBasicMaterial({
        color: 0xFFF26D,
        emissive: 0xFFD700,
        emissiveIntensity: 1.5
      });
      //MeshBasicMaterial is unaffected by light — perfect for the Sun because it should appear to glow.

      const sunGeometry = new THREE.SphereGeometry(2, 32, 32);
      // Sphere geometry radius 2,32  width/height  segments (smooth  sphere)
      const sun = new THREE.Mesh(sunGeometry, sunMaterial);
      sun.castShadow = false; // Sun does NOT cast shadows 
      sun.receiveShadow = false;// Sun doesnt have to receive shadows because is the object that's emiting the light 
      scene.add(sun);
      sun.add(sunLight);// SUNLIGHT IS A POINT LIGHT 
      // Attach the point light to the sun mesh so the light moves with the sun (here the sun is stationary)
       // Fixed 2 now the sunlight is attached to the sun 2025-12-12

      /* Adding ------------------- MERCURY -------------has to receive the shadows is a receptor E Leon 25-11-12 ---- */
      const mercuryMaterial = new THREE.MeshStandardMaterial({
        color: 0xB8B8B8,
        emissive: 0x444444,
        emissiveIntensity: 0.05,
        roughness: 0.8
      });
      //MeshStandardMaterial reacts to lights and supports shadows,we set low emissiveIntensity to keep shading visible

      const mercury = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 32, 32),
        mercuryMaterial
      );
      mercury.position.x = 3; // initial position at radius 3 units form center on the x axis
      mercury.castShadow = true; // this mesh will cast shadows onto other receiving objetcs
      mercury.receiveShadow = true;// it has to receive shadows from the emisor the sun 
      scene.add(mercury); 

      /* Adding ------------------- VENUS --------------------E Leon 25-11-12 */
      const venusMaterial = new THREE.MeshStandardMaterial({
        color: 0xE6C27A,
        emissive: 0xB8924C,
        emissiveIntensity: 0.05,
        roughness: 0.7
      });

      const venus = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 32, 32),
        venusMaterial
      );
      venus.position.x = 4.5;
      venus.castShadow = true;
      venus.receiveShadow = true;
      scene.add(venus);

      /* Adding ------------------- EARTH -------------------- */
      const earthMaterial = new THREE.MeshStandardMaterial({
        color: 0x1E90FF,
        emissive: 0x009999,
        emissiveIntensity: 0.05,
        roughness: 0.5,
        metalness: 0.1
      });

      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 32, 32),
        earthMaterial
      );
      earth.position.x = 6;
      earth.castShadow = true;
      earth.receiveShadow = true;
      scene.add(earth);

      /* Adding ------------------- MARS --------------------*/
      const marsMaterial = new THREE.MeshStandardMaterial({
        color: 0xFF7043,
        emissive: 0x993300,
        emissiveIntensity: 0.05,
        roughness: 0.6
      });

      const mars = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 32, 32),
        marsMaterial
      );
      mars.position.x = 10;
      mars.castShadow = true;
      mars.receiveShadow = true;
      scene.add(mars);

      /* Adding ------------------- ORBITS -------------------- */
      const orbitMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc });
      // Simple thin gray line for orbit paths
      

      
      // addOrbit builds a circular line using many small segments
      function addOrbit(radius) {
        const points = [];
        for (let i = 0; i <= 64; i++) {
          const angle = (i / 64) * Math.PI * 2;
          points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        scene.add(new THREE.LineLoop(geometry, orbitMaterial));
      }

      addOrbit(3); // Mercury orbit 
      addOrbit(4.5); //Venus orbit 
      addOrbit(6); //Earth orbit 
      addOrbit(10); //Mars orbit

      /* ------------------- RAYCAST -------------------- */
      const raycaster = new THREE.Raycaster();// this ray will detect mouse clicks in the 3D objects Emmanuel leon 2025-12-12
      const pointer = new THREE.Vector2();// selector that coordinates the mouse pointer in the screen
      const planets = [sun, mercury, venus, earth, mars];  // list of clickable planets
        


      window.addEventListener('click', (event) => {
        // Convert screen coordinates to normalized device coordinates (NDC) [-1,+1]
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1; // cast a ray from the camera through the pointer position
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1; // returns intersected objects sorted by distance

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(planets);

        if (hits.length > 0) {
          const hit = hits[0].object; // nearest intersected object
          const name =
            hit === sun ? 'Sun' :
            hit === mercury ? 'Mercury' :
            hit === venus ? 'Venus' :
            hit === earth ? 'Earth' :
            'Mars';
          document.getElementById('info').innerText = `You Clicked: ${name}`; // Show the lcicked planet 
        }
      });

      /* ------------------- ANIMATION -------------------- */
      const clock = new THREE.Clock(); // Fixed 3 provides elapsed time with consistent pausing and resetting Emmanuel L 2025-12-12

      // IS BETTER TO NOT USE DATE.NOW() BECAUSE THE TRANSITIONS MIGHT SEEM INCONSISTENT 

      function animate() {
        requestAnimationFrame(animate); // ask browser to call animate again for next frame
        const t = clock.getElapsedTime(); // time in seconds since clock started


        // updates each planet's x and z so they cirle around the sun 
        mercury.position.set(3 * Math.cos(t * 1.2), 0, 3 * Math.sin(t * 1.2));
        venus.position.set(4.5 * Math.cos(t * 0.9), 0, 4.5 * Math.sin(t * 0.9));
        earth.position.set(6 * Math.cos(t * 0.5), 0, 6 * Math.sin(t * 0.5));
        mars.position.set(10 * Math.cos(t * 0.3), 0, 10 * Math.sin(t * 0.3));

        sun.rotation.y += 0.002; // slowly rotate the Sun mesh for subtle motion  Emmanuel Leon 25-12-12

        controls.update();// required by orbitControls for damping, if used (safe to call)
        renderer.render(scene, camera); // draw the current scene  from the camera
      }
      animate(); // Function that render the loop

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;// update camera aspect when window resizes  
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);// resize render to fill window
      });
    </script>
  </body>
</html>
